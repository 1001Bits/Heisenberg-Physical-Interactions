; Heisenberg F4VR - MCM Default Settings
; This file is the MCM Helper registration/defaults file.
; Every setting listed in config.json MUST have a matching entry here.
; MCM Helper registers settings from this file - missing entries cause
; "Setting not found" errors and prevent saving.
; User changes are stored in MCM\Settings\Heisenberg.ini (overwrite folder).
; Note: Bool values use 1/0 format for MCM compatibility.

[ObjectPickup]
bEnablePalmSnap=1
bEnableNaturalGrab=1
fNaturalGrabDistance=5.0
bEnableStickyGrab=0
bAllowGrabbingOwnedItems=1
bUseXForLeftGrab=0
bUseAForRightGrab=0
fThrowVelocityBoostFactor=1.0
iWeaponEquipMode=1
bShowHolsterMessages=1
bShowUnequipMessages=1

[Pickpocket]
bEnablePickpocket=1

[ItemPositioning]
bEnableItemPositioning=0

[Equipping]
iArmorEquipZone=1

[ItemStorage]
bEnableItemStorageZones=1
bEnableAutoStorage=1
fStorageZoneHoldTime=0.5
fItemStorageZoneRadius=15.0
bEnableDropToContainer=1
bEnableDropToCompanion=1
bShowStorageMessages=1

[DropToHand]
bEnableDropToHand=1
iLootToHandMode=1
iDropToHandPreferredHand=2
bEnableStealToHand=1
bFavoritesToHand=0
bEnableHarvestToHand=0

[Consumables]
bConsumableToHand=0
bHolotapeToHand=1
iConsumableActivationZone=1
bAutoConsumeInMouthArea=0
bEnableHandInjection=1
bAutoConsumeInWristArea=0
fMouthRadius=11.0
fMouthVelocityThreshold=2.0
bBlockConsumptionInPA=1
bShowConsumeMessages=1

[Cooking]
bEnableCooking=1
fCookTime=3.0
bCookingStationOnly=0

[Throwables]
bRemapGrenadeButtonToA=0
fThrowableHoldDuration=0.3
iThrowableActivationZone=0
fThrowableZoneRadius=20.0

[SmartGrab]
bEnableSmartGrab=1
fHealthThreshold=0.5
fRadsThreshold=0.25
bIncludeHealth=1
bIncludeFood=1
bIncludeCombatChems=0
bIncludeAntibiotics=1
bIncludeHeavyJunk=0

[Pipboy]
bForceTerminalOnWrist=1
bHideWandHUD=1
bHideAllWandHUD=0

[Water]
bEnableWaterInteraction=1
fSplashScale=1.0
bEnableWakeRipples=1

[Activators]
bEnableInteractiveActivators=1
fActivatorPointingRadius=25.0
fActivatorActivationRadius=8.0
fActivatorCooldownMs=1000.0

[Impact]
bImpactDamageEnabled=1
fImpactDamageMult=1.0
bImpactDestroyEnabled=1
fImpactMinDestroySpeed=250.0
bImpactDetectionEvent=1
bImpactHitEvent=1

[RockIntegration]
; Support-hand steering authority for two-handed weapons. Lives in Heisenberg's config
; rather than ROCK's [PhysicsInteraction] because MCM cannot reach the engine's own INI -
; the value is bridged to the engine per frame via HostSetTwoHandedMinSteeringAuthority.
fOffHandSteeringAuthority=0.35
