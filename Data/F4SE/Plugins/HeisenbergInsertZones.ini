; ============================================================================
; HeisenbergInsertZones.ini - Item insertion zones for activators
; ============================================================================
; 
; This defines "insert zones" where holding a specific item near an activator
; will trigger it. For example, holding a bottle cap near a Nuka-Cola machine's
; coin slot.
;
; Zone sections: [Description:HEXID]
;   HEXID is the base form ID of the activator (or 0 for editor ID matching)
;
;   sTargetNode       - Specific child node name to use for zone position
;   fActivationRadius - Distance to trigger activation (game units, ~1 unit = 1.4cm)
;   fOffsetX/Y/Z      - Position offset from node center
;   sAcceptedItems    - Comma-separated hex IDs of items that work
;   sEditorIDPattern  - Match activators by editor ID containing this string
;   bConsumeItem      - Remove item from inventory after use (default: false)
;   bPlayAnimation    - Trigger the activator's animation (default: true)
;
; ============================================================================

[General]
; Enable discovery mode to log activator info when items are brought near
bDiscoveryMode = false

; ============================================================================
; DEFAULT ZONES
; ============================================================================

; Nuka-Cola Machine - accepts bottle caps
; Base form ID 000302DC - matched directly by form ID
; Coin slot is offset from the "Door" node: X=-57 (left), Y=0 (center), Z=8 (up)
; Using Y=0 with larger radius to cover both orientations (Y=-12 and Y=+18)
[Nuka-Cola Machine:000302DC]
sTargetNode = Door
fActivationRadius = 25.0
fOffsetX = -57.0
fOffsetY = 0.0
fOffsetZ = 8.0
; Bottle Cap = 0x0000000F, Pre-War Money = 0x00059B02, Nuka-Cade Token = 0x01998A (Nuka-World DLC)
sAcceptedItems = 0x0000000F, 0x00059B02, 0x01998A
bConsumeItem = true
bPlayAnimation = true

