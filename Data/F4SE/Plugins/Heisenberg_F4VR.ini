[Selection]

; Game units - radius for proximity detection
fProximityRadius = 200.000000
fNearCastRadius = 15.000000
fNearCastDistance = 200.000000
fRequiredCastDotProduct = 0.500000

; Within this distance = natural grab, beyond = palm snap (~5 = 5cm)
fCloseGrabThreshold = 20.000000

; Pull objects to your hand when grabbing
bEnablePullToHand = true

; Game units/s - speed to pull objects
fPullSpeed = 500.000000

; Game units - distance at which object snaps to hand
fSnapDistance = 5.000000

; Object follows hand from current distance (overrides pull-to-hand)
bEnableTelekinesis = false


[SeatedMode]

; Enable automatic seated player detection
bEnableSeatedMode = false

; HMD height below this = seated (game units, ~110 = 110cm)
fSeatedModeHeightThreshold = 110.000000

; Extended grab range when seated (~150 = 1.5m)
fSeatedModeGrabDistance = 150.000000

; Close grab range when standing (~40 = 40cm)
fStandingModeGrabDistance = 100.000000


[ObjectPickup]

; Master toggle for object pickup feature
bEnableGrabbing = true

; Allow picking up items that would be considered stealing
bAllowGrabbingOwnedItems = true

; Press grip once to pick up, again to release
bEnableStickyGrab = false

; 0=Disabled, 1=Drop on weapon hand, 2=Auto equip
iWeaponEquipMode = 1

; Drop weapon on VH holster zone to holster
bEnableVHHolstering = true

; Auto-unequip Unarmed when grip pressed (disable if melee broken)
bEnableUnarmedAutoUnequip = true

; Prevent grip from drawing/sheathing weapons
bDisableGripWeaponDraw = true

; When grip-weapon-draw is off, still pass primary grip to the game when aiming at an activator/furniture (mod secondary actions)
bPassGripToActivatorSecondary = true

; Control grenade readying at the game level (hook MeleeThrowHandler) instead of stripping grip input (fixes VirtualHolsters/reload/secondary)
bUseGrenadeReadyHook = true

; Show HUD message when holstering weapons
bShowHolsterMessages = true

; Show HUD message when unequipping weapons
bShowUnequipMessages = true

; Allow one object to be held at two distinct mesh spots, one per hand
bEnableTwoHandedGrab = true

; 0=Keyframed (Heisenberg owns grab/selection), 9=Full Dynamic (embedded ROCK owns grab/selection). Other values degrade to 0.
iGrabMode = 0

; Keyframed hold keeps object collidable so it can hit other objects (iGrabMode=0 only)
bHeldObjectCollidable = true

; Keyframed hold: sweep-cast the held object so it STOPS at walls and NPCs instead of clipping through (iGrabMode=0)
bHeldObjectWallClamp = false

; Block A/activate looting an item just because you're aiming at it. OFF by default (ON broke A-looting + mod secondary actions). Only enable for a Grip>A SteamVR binding.
bBlockActivateOnGrabSelection = false

; Use X button instead of Grip for left hand grabbing
bUseXForLeftGrab = false

; Use A button instead of Grip for right hand grabbing
bUseAForRightGrab = false
fGrabStartSpeed = 200.000000
fGrabStartAngularSpeed = 360.000000

; Use natural grab for close objects (vs always palm snap)
bEnableNaturalGrab = true

; cm - max distance for telekinesis grab. Object Pull will not activate within this range.
fMaxGrabDistance = 500.000000

; cm - within this distance = natural pickup (object follows touch point)
fNaturalGrabDistance = 6.000000

; cm - natural pickup distance for items without exact offset match
fNaturalGrabDistanceNoMatch = 10.000000

; Snap objects to palm center for mid-range pickups
bEnablePalmSnap = true

; Auto-save natural pickup positions as item offsets (default off)
bSaveNaturalGrabAsOffset = false

; Prefer palm-ray hit over closest-point for grip placement (handles/levers)
bEnablePalmRayCastPlacement = true

; Place object near-face at palm with small clearance, extending forward along palmDir
bEnableAxialPlacement = true

; cm from palm to object near face when axial placement is enabled
fAxialPlacementClearance = 0.000000

; Squared distance (game units) from closest-mesh-point to consider a triangle nearby for finger intersection (HIGGS default 100)
fGrabMaxTriangleDistance = 100.000000

; Weight on directional distance squared when scoring closest-point-on-geometry (HIGGS default 0.4)
fGrabDirectionalWeight = 0.400000

; Weight on lateral distance squared when scoring closest-point-on-geometry (HIGGS default 0.6)
fGrabLateralWeight = 0.600000

; cm to shift palm anchor from knuckle centroid into palm cup (palmar side)
fPalmDepthOffset = 2.000000

; Recompute geometry finger curl every N frames during hold
bEnableAutomaticFingerCurlsPerFrame = false

; Frames between per-frame finger curl re-evaluations (1=every frame)
iFingerCurlPerFrameInterval = 3

; Lerp factor 0..1 for per-frame finger curl smoothing (lower=snappier)
fFingerCurlSmoothingAlpha = 0.250000

; Game units - left/right offset (0 = centered)
fPalmOffsetX = 0.000000

; Game units - forward offset (toward fingers, ~5 = 5cm)
fPalmOffsetY = 5.000000

; Game units - up/down offset (~3.5 = 5cm up from wand)
fPalmOffsetZ = 3.500000

; Hand-local palm normal X (mirrored for left hand)
fPalmVectorX = -0.018000

; Hand-local palm normal Y (points out of palm toward grabbed object)
fPalmVectorY = 0.261000

; Hand-local palm normal Z
fPalmVectorZ = -0.965000

; Hand-local palm center X (cm, mirrored for left hand)
fPalmPositionX = 0.000000

; Hand-local palm center Y (cm)
fPalmPositionY = 6.000000

; Hand-local palm center Z (cm)
fPalmPositionZ = -2.400000

; Game units - extra X offset when in power armor (0 = no shift)
fPAGrabOffsetX = 0.000000

; Game units - extra Y offset in PA (forward, out of glove)
fPAGrabOffsetY = 2.000000

; Game units - extra Z offset in PA (up, above palm)
fPAGrabOffsetZ = 1.000000

; Enable hand collision with world
bEnableHandCollision = true

; Game units - radius of hand collision sphere (broadphase reach)
fHandCollisionRadius = 3.000000

; Game units - bone-to-mesh distance counted as TRUE contact (push trigger); ~finger flesh radius, smaller = must touch closer
fHandContactSlop = 1.500000

; Min hand speed to push objects (lower = more sensitive)
fHandPushVelocityThreshold = 10.000000

; Push force multiplier (higher = stronger)
fHandPushForceMultiplier = 1.500000

; Controller buzz on hand-object contact
bEnableHandCollisionHaptics = true

; Microseconds per mass-speed unit for haptic pulse
fHandCollisionHapticScale = 100.000000

fThrowVelocityBoostFactor = 1.000000


[ItemPositioning]

; Enable item positioning mode (hold L3 to configure)
