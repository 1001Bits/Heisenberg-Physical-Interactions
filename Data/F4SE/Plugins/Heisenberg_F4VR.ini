[ObjectPickup]

; Allow picking up items that would be considered stealing
bAllowGrabbingOwnedItems = true

; Press grip once to pick up, again to release
bEnableStickyGrab = false

; 0=Disabled, 1=Drop on weapon hand, 2=Auto equip
iWeaponEquipMode = 1

; Full Dynamic: embedded ROCK owns selection and finite-constraint grabbing.
; If the engine cannot load, Heisenberg falls back to keyframed grabbing.
iGrabMode = 9

; Show HUD message when holstering weapons
bShowHolsterMessages = true

; Show HUD message when unequipping weapons
bShowUnequipMessages = true

; Use X button instead of Grip for left hand grabbing
bUseXForLeftGrab = false

; Use A button instead of Grip for right hand grabbing
bUseAForRightGrab = false

; Use natural grab for close objects (vs always palm snap)
bEnableNaturalGrab = true

; cm - within this distance = natural pickup (object follows touch point)
fNaturalGrabDistance = 6.000000

; Snap objects to palm center for mid-range pickups
bEnablePalmSnap = true

fThrowVelocityBoostFactor = 1.000000

[ItemPositioning]

; Enable item positioning mode (hold L3 to configure)
bEnableItemPositioning = false

[DropToHand]

; 0=Off, 1=Hybrid (blocked->inventory), 2=Immersive (blocked->floor)
iLootToHandMode = 0

; Consumables from Favorites go to hand
bFavoritesToHand = true

; Items stolen from NPCs go to hand
bEnableStealToHand = true

; Harvested flora goes to hand
bEnableHarvestToHand = true

[ItemStorage]

; Enable item storage zone system
bEnableItemStorageZones = true

; cm - radius of storage zone
fItemStorageZoneRadius = 16.799999

; seconds - how long to hold in zone before auto-storing
fStorageZoneHoldTime = 0.500000

; Drop item near companion to give it to them
bEnableDropToCompanion = true

; Auto-store after holding in zone for duration
bEnableAutoStorage = true

; Show HUD message when storing items
bShowStorageMessages = true


; Release while pointing at a chest/desk deposits the item into it
bEnableDropToContainer = true
[Consumables]

; 0=Disabled, 1=Mouth/Face
iConsumableActivationZone = 1

; cm - sphere radius for consume detection
fMouthRadius = 15.400000

; Legacy compatibility value; release-based consumption has no speed requirement
fMouthVelocityThreshold = 2.000000

; Consume in the mouth area without releasing grip (default off)
bAutoConsumeInMouthArea = false

; Block manual consumption/chem use while in Power Armor
bBlockConsumptionInPA = true

; Show HUD message when consuming items
bShowConsumeMessages = true

; Redirect Pipboy consume to drop-to-hand
bConsumableToHand = true

; Redirect Pipboy holotape play to drop-to-hand
bHolotapeToHand = true

; Enable injection consumption on opposite hand
bEnableHandInjection = true

; Inject in the wrist area without releasing grip (default off)
bAutoConsumeInWristArea = false

; SS2 Disease Cure is reserved for physical use on another settler.
bEnableNpcInjection = true

; Allow physical Stimpak revival of the player's current companion.
bEnableCompanionStimpakInjection = true

; Game units from cure probe to the settler body capsule.
fNpcInjectionRadius = 25.000000

; Confirm the exact NPC treatment result on the HUD.
bShowInjectionMessages = true

[Equipping]

; 0=Disabled, 1=Enabled (drop armor on body to equip)
iArmorEquipZone = 1

[Cooking]

; Enable cooking by holding raw food near fire/cooking station
bEnableCooking = true

; Seconds near fire to cook
fCookTime = 3.000000

; Only cook at cooking stations (not near heat sources)
bCookingStationOnly = false

[SmartGrab]

; Enable context-aware item retrieval from inventory (grip behind head)
bEnableSmartGrab = true

; Pull stimpak when health below this fraction (0.5 = 50%)
fHealthThreshold = 0.500000

; Pull RadAway when rads above this fraction (0.25 = 25%)
fRadsThreshold = 0.250000

; Include stimpaks, healing items
bIncludeHealth = true

; Include food and drinks
bIncludeFood = true

; Include Psycho, Jet, Buffout, etc.
bIncludeCombatChems = false

; Include antibiotics/disease cures
bIncludeAntibiotics = true

; Include heavy junk for companion drops
bIncludeHeavyJunk = false

[Pipboy]
bForceTerminalOnWrist = true


; Hide the wand HUD action prompts (item name still shows)
bHideWandHUD = true

; Hide all wand HUD elements including the item name
bHideAllWandHUD = false
[Water]

; Enable water ripple/splash effects for VR hands
bEnableWaterInteraction = true

; Global splash/ripple scale multiplier (1.0 = default)
fSplashScale = 0.100000

; Continuous ripples while hand moves underwater
bEnableWakeRipples = true

[Debug]

; Temporarily show launch/config/hook diagnostics before iLogLevel is applied.
bVerboseLaunch = false

; Lightweight end-to-end frame-pacing A/B benchmark. This is independent of
; the detailed subsystem profiler below and writes asynchronously to
; ROCK_Profiler.log. Hot-reload this value between otherwise identical runs:
;   0 = Off (release default)
;   1 = A: full ROCK runtime
;   2 = B: ROCK live work bypassed by the host
iPerformanceBenchmarkMode = 0

; Shared benchmark/profiler window and warmup lengths. Menu, loading, and
; transition gaps are excluded by the benchmark's frame-boundary integration.
iPerformanceProfilerLogIntervalFrames = 300
iPerformanceProfilerWarmupFrames = 120

; Detailed subsystem timers are deliberately separate and off by default so
; they cannot perturb benchmark A/B results.
bPerformanceProfilerEnabled = false
bPerformanceProfilerOverlayText = false


; 0=trace, 1=debug, 2=info, 3=warn, 4=error
iLogLevel = 3
[PhysicsInteraction]

; ── LARGE-OBJECT POLICY (car fix) ────────────────────────────────────────────
; Read by the embedded ROCK engine (rock::RockConfig) AND by Heisenberg's grab
; selection. These values govern only oversized-object grab rejection now;
; vanilla player-body collision is preserved independently for all native props.
;
; Cars are all on collision layer 29 (CLUTTER_LARGE) — but so are metal barrels,
; tyres, trash cans and the baby carriage, which must stay grabbable. The
; discriminator is SIZE: base-form BOUND_DATA largest axis x ref scale, in game
; units (1 game unit = 0.0142875 m). Measured: tyre/cone 43-44, barrel/trash can
; 71-76, baby carriage 107 (largest keeper), motorcycle 199, sedan 427.

; Master switch for oversized-object grab rejection.
bLargeObjectPlayerBlockEnabled = true

; Size threshold in game units. Clamped to 40..1000 on load.
; 150 is the tested value; the usable window is roughly 110-195.
fLargeObjectBoundThresholdGameUnits = 150.0

; Objects over the threshold cannot be grabbed / pulled to hand.
bLargeObjectGrabBlockEnabled = true

; Legacy compatibility keys (no longer alter collision policy). Every valid
; vanilla-native body, from small clutter through cars, retains its native
; player character-controller collision.
bLargeObjectCharacterControllerBlockEnabled = true

bLargeObjectBlockRestrictToClutterLargeLayer = true

; Enable solver-backed free-hand stopping against walls and the equipped weapon.
bHandWorldPushbackEnabled = true

; Use dynamic proxy bodies as the single free-hand collision presentation owner.
; The legacy soft-contact hand channel automatically stands down, while the
; independent equipped-weapon/world channel remains enabled.
bHandCollisionDynamicDrive = true

; Carry held bodies in player/room space exactly once per object and smooth
; constraint velocity corrections during locomotion.
bGrabRoomVelocityFeedForward = true
bGrabLocomotionTransport = true
bGrabSmoothVelocityDrive = true
fGrabSmoothVelocityCorrectorGain = 0.200000
; Sweep each held native convex shape through translation and rotation, stopping
; the finite constraint target before static world geometry. Non-convex and
; compound bodies use a conservative oriented convex bounds proxy.
bGrabHeldObjectSweepEnabled = true
fGrabHeldObjectSweepSkinGameUnits = 0.750000
fGrabHeldObjectSweepMinDistanceGameUnits = 0.500000
; Primary body is always first; connected-body casts are bounded per hand/frame.
iGrabHeldObjectSweepMaxBodies = 16
; Rotational CCD uses both angular and surface-arc subdivision. The global cast
; budget is shared by the primary and rotating fair-share connected bodies.
bGrabHeldObjectSweepRotationEnabled = true
fGrabHeldObjectSweepMaxAngularStepDegrees = 5.000000
fGrabHeldObjectSweepMaxSurfaceArcStepGameUnits = 2.000000
iGrabHeldObjectSweepMaxCasts = 48
; Never transform-warp held objects during ordinary stick/room locomotion.
; Teleports and snap-turn discontinuities retain their bounded warp path.
bGrabPlayerSpaceContinuousWarp = false
fGrabPlayerSpaceWarpMinRotationDegrees = 12.000000

[RockEngine]

; Host the complete embedded ROCK physics engine. This is the implementation
; behind dynamic grabs and generated hand/weapon/world collision.
bUseRockEngineArchitecture = true
